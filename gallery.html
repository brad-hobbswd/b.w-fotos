<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gallery | b.w fotos</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ===== GLOBAL ===== */
body{
  margin:0;
  font-family:'Inter', sans-serif;
  background:#1a1714;
  color:#e6dccf;
}

h1,h2{
  font-family:'Playfair Display', serif;
}

a{
  text-decoration:none;
  color:#d4a5ff;
}

/* ===== NAV ===== */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  border-bottom:1px solid rgba(212,165,255,0.2);
}

.nav-links a{
  margin-left:20px;
  opacity:.8;
}

/* ===== HERO ===== */
.hero{
  text-align:center;
  padding:50px 20px 10px;
}

/* ===== ALBUM GRID ===== */
.albums{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(240px,1fr));
  gap:20px;
  padding:30px;
}

.album{
  position:relative;
  cursor:pointer;
}

.album img{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:12px;
}

.album-title{
  position:absolute;
  bottom:0;
  width:100%;
  background:rgba(0,0,0,0.6);
  padding:10px;
  text-align:center;
}

/* ===== THUMBNAIL GRID ===== */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
  gap:10px;
  padding:20px;
}

.gallery img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:8px;
  cursor:pointer;
}

/* ===== LIGHTBOX ===== */
.lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
}

.close{
  position:absolute;
  top:20px;
  right:30px;
  font-size:40px;
  color:white;
  cursor:pointer;
}

.prev, .next{
  position:absolute;
  top:50%;
  font-size:40px;
  color:white;
  cursor:pointer;
}

.prev{ left:20px; }
.next{ right:20px; }

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:30px;
  opacity:.6;
}

</style>

</head>

<body>

<!-- NAV -->
<nav>
  <div>b.w fotos</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="portraits.html">Portraits</a>
    <a href="bookings.html">Book</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>Gallery</h1>
</section>

<!-- ALBUMS -->
<section class="albums">

  <div class="album" onclick="openAlbum('embassy')">
    <img src="images/IMG_1750.jpeg">
    <div class="album-title">Embassy Suites</div>
  </div>

  <div class="album" onclick="openAlbum('falls')">
    <img src="images/IMG_1754.jpeg">
    <div class="album-title">76 Falls</div>
  </div>

  <div class="album" onclick="openAlbum('rv')">
    <img src="images/IMG_1764.jpeg">
    <div class="album-title">Thompson RV</div>
  </div>

  <div class="album" onclick="openAlbum('school')">
    <img src="images/IMG_1770.jpeg">
    <div class="album-title">Old Flat Lick</div>
  </div>

  <div class="album" onclick="openAlbum('park')">
    <img src="images/IMG_1784.jpeg">
    <div class="album-title">Random Park</div>
  </div>

  <div class="album" onclick="openAlbum('rock')">
    <img src="images/IMG_1797.jpeg">
    <div class="album-title">Rockcastle</div>
  </div>

  <div class="album" onclick="openAlbum('extra')">
    <img src="images/IMG_1804.jpeg">
    <div class="album-title">Campfire & Wind Chime</div>
  </div>

</section>

<!-- THUMBNAILS -->
<section class="gallery" id="albumView"></section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">&times;</span>
  <span class="prev" onclick="prevImage()">&#10094;</span>
  <img id="lightbox-img">
  <span class="next" onclick="nextImage()">&#10095;</span>
</div>

<footer>
  © 2026 b.w fotos
</footer>

<script>

const albums = {

  embassy:[
    "images/IMG_1750.jpeg","images/IMG_1751.jpeg","images/IMG_1752.jpeg","images/IMG_1753.jpeg"
  ],

  falls:[
    "images/IMG_1754.jpeg","images/IMG_1755.jpeg","images/IMG_1756.jpeg","images/IMG_1757.jpeg",
    "images/IMG_1758.jpeg","images/IMG_1759.jpeg","images/IMG_1760.jpeg","images/IMG_1761.jpeg",
    "images/IMG_1762.jpeg","images/IMG_1763.jpeg"
  ],

  rv:[
    "images/IMG_1764.jpeg","images/IMG_1765.jpeg","images/IMG_1766.jpeg",
    "images/IMG_1767.jpeg","images/IMG_1768.jpeg","images/IMG_1769.jpeg"
  ],

  school:[
    "images/IMG_1770.jpeg","images/IMG_1771.jpeg","images/IMG_1772.jpeg","images/IMG_1773.jpeg",
    "images/IMG_1774.jpeg","images/IMG_1775.jpeg","images/IMG_1776.jpeg","images/IMG_1777.jpeg",
    "images/IMG_1778.jpeg","images/IMG_1779.jpeg","images/IMG_1780.jpeg","images/IMG_1781.jpeg",
    "images/IMG_1782.jpeg","images/IMG_1783.jpeg"
  ],

  park:[
    "images/IMG_1784.jpeg","images/IMG_1785.jpeg","images/IMG_1786.jpeg","images/IMG_1787.jpeg",
    "images/IMG_1788.jpeg","images/IMG_1789.jpeg","images/IMG_1790.jpeg","images/IMG_1791.jpeg",
    "images/IMG_1792.jpeg","images/IMG_1793.jpeg","images/IMG_1794.jpeg","images/IMG_1795.jpeg",
    "images/IMG_1796.jpeg"
  ],

  rock:[
    "images/IMG_1797.jpeg","images/IMG_1798.jpeg","images/IMG_1799.jpeg"
  ],

  extra:[
    "images/IMG_1804.jpeg","images/IMG_1805.jpeg"
  ]

};

let currentAlbum = [];
let currentIndex = 0;

function openAlbum(name){
  const container = document.getElementById("albumView");
  container.innerHTML = "";
  currentAlbum = albums[name];

  currentAlbum.forEach((img,i)=>{
    container.innerHTML += `<img src="${img}" onclick="openLightbox(${i})">`;
  });

  window.scrollTo({top:container.offsetTop, behavior:"smooth"});
}

function openLightbox(i){
  currentIndex = i;
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lightbox-img").src=currentAlbum[i];
}

function nextImage(){
  currentIndex = (currentIndex+1)%currentAlbum.length;
  document.getElementById("lightbox-img").src=currentAlbum[currentIndex];
}

function prevImage(){
  currentIndex = (currentIndex-1+currentAlbum.length)%currentAlbum.length;
  document.getElementById("lightbox-img").src=currentAlbum[currentIndex];
}

function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
}

/* keyboard */
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight") nextImage();
  if(e.key==="ArrowLeft") prevImage();
  if(e.key==="Escape") closeLightbox();
});

/* swipe */
let startX=0;

document.getElementById("lightbox").addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
});

document.getElementById("lightbox").addEventListener("touchend",e=>{
  let endX=e.changedTouches[0].clientX;
  if(endX-startX>50) prevImage();
  if(startX-endX>50) nextImage();
});

</script>

</body>
</html>
