<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gallery | b.w fotos</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ===== GLOBAL ===== */
body{
  margin:0;
  font-family:'Inter', sans-serif;
  background:#1a1714;
  color:#e6dccf;
}

h1,h2{
  font-family:'Playfair Display', serif;
  letter-spacing:1px;
}

a{
  text-decoration:none;
  color:#d4a5ff;
}

/* ===== NAV ===== */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  border-bottom:1px solid rgba(212,165,255,0.2);
}

.logo{
  font-size:20px;
  letter-spacing:2px;
}

.nav-links a{
  margin-left:25px;
  font-size:14px;
  opacity:.8;
}

.nav-links a:hover{
  opacity:1;
}

/* ===== HERO ===== */
.hero{
  text-align:center;
  padding:100px 20px 40px;
}

.hero h1{
  font-size:42px;
  margin-bottom:10px;
}

.hero p{
  color:#d4a5ff;
  letter-spacing:2px;
}

/* ===== FILTER (future use) ===== */
.filters{
  text-align:center;
  margin-bottom:30px;
}

.filters button{
  margin:5px;
  padding:8px 15px;
  border:1px solid #d4a5ff;
  background:transparent;
  color:#d4a5ff;
  border-radius:20px;
  cursor:pointer;
}

.filters button:hover{
  background:#d4a5ff;
  color:#1a1714;
}

/* ===== GALLERY GRID ===== */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
  gap:15px;
  padding:20px;
}

.gallery-item{
  overflow:hidden;
  border-radius:10px;
}

.gallery-item img{
  width:100%;
  height:260px;
  object-fit:cover;
  transition:.3s;
}

.gallery-item img:hover{
  transform:scale(1.05);
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:40px;
  border-top:1px solid rgba(212,165,255,0.2);
  font-size:13px;
  opacity:.6;
}

</style>

</head>

<body>

<!-- ===== NAV ===== -->
<nav>
  <div class="logo">b.w fotos</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="portraits.html">Portraits</a>
    <a href="mini-sessions.html">Mini Sessions</a>
    <a href="scenic.html">Scenic</a>
    <a href="bookings.html">Book</a>
  </div>
</nav>

<!-- ===== HERO ===== -->
<section class="hero">
  <h1>Gallery</h1>
  <p>CAPTURING MOMENTS ACROSS EVERY STORY</p>
</section>

<!-- ===== FILTERS (optional for later) ===== -->
<div class="filters">
  <button>All</button>
  <button>Portraits</button>
  <button>Mini Sessions</button>
  <button>Scenic</button>
</div>

<!-- ===== GALLERY ===== -->
<section class="gallery">

  <!-- Replace with your actual images -->
  <div class="gallery-item">
    <img src="images/photo1.jpg" alt="">
  </div>

  <div class="gallery-item">
    <img src="images/photo2.jpg" alt="">
  </div>

  <div class="gallery-item">
    <img src="images/photo3.jpg" alt="">
  </div>

  <div class="gallery-item">

  </div>

  <div class="gallery-item">
    <img src="images/photo5.jpg" alt="">
  </div>

  <div class="gallery-item">
    <img src="images/photo6.jpg" alt="">
  </div>

</section>

<!-- ===== FOOTER ===== -->
<footer>
  © 2026 b.w fotos | Capturing Moments. Preserving Stories.
</footer>

</body>
