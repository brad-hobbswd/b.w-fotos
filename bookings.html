<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Book a Session | b.w fotos</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ===== GLOBAL ===== */
body{
  margin:0;
  padding-top:100px;
  font-family:'Inter', sans-serif;
  background:#1a1714;
  color:#e6dccf;
}

h1,h2,h3{
  font-family:'Playfair Display', serif;
  letter-spacing:1px;
}

a{
  text-decoration:none;
  color:#d4a5ff;
}

/* ===== HERO ===== */
.hero{
  text-align:center;
  padding:100px 20px 40px;
}

.hero h1{
  font-size:42px;
  margin-bottom:10px;
}

.hero p{
  color:#d4a5ff;
  letter-spacing:2px;
}

/* ===== BOOKING CARD ===== */
.booking-card{
  max-width:700px;
  margin:40px auto;
  background:#211d19;
  padding:40px;
  border-radius:12px;
  border:1px solid rgba(212,165,255,0.2);
  text-align:center;
}

/* ===== FORM ===== */
form{
  display:flex;
  flex-direction:column;
  gap:15px;
  margin-top:20px;
}

input, textarea, select{
  padding:12px;
  border:none;
  border-radius:8px;
  background:#2a241f;
  color:#e6dccf;
  font-family:'Inter', sans-serif;
}

button{
  padding:14px;
  border:none;
  border-radius:25px;
  background:#d4a5ff;
  color:#1a1714;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  opacity:.9;
}

/* ===== FOOTER SYSTEM ===== */
.site-footer{
  margin-top:80px;
  padding:40px 20px;
  text-align:center;
  font-size:13px;
  color:#e6dccf;
  opacity:.7;
}

.footer-line{
  width:60%;
  height:1px;
  background:rgba(212,165,255,0.2);
  margin:0 auto 25px;
}

.footer-content{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.site-footer a{
  color:#d4a5ff;
}

</style>

</head>

<body>

<div id="header"></div>

<section class="hero">
  <h1>Book a Session</h1>
  <p>SIMPLE. CLEAR. CONNECTED.</p>
</section>

<section class="booking-card">

  <h2>Request Your Session</h2>

  <p>
    Fill out the form below to request your session.
  </p>

  <p>
    Your request will be reviewed and confirmed based on availability.
  </p>

  <form 
    action="https://docs.google.com/forms/d/e/1FAIpQLScJiZu-JQJEJx7YpF1LQE3MdShybpF902qouPUPXXDXB21ewA/formResponse" 
    method="POST"
    target="hidden_iframe"
    onsubmit="submitted=true; setTimeout(function(){ window.location.href='thanks.html'; }, 500);">

    <input 
      type="text" 
      name="entry.2025350842" 
      placeholder="Your Name" 
      required>

    <input 
      type="email" 
      name="entry.601827311" 
      placeholder="Email Address" 
      required>

    <input 
      type="text" 
      name="entry.244855288" 
      placeholder="Phone Number">

    <select name="entry.202428847" required>
      <option value="">Select Session Type</option>
      <option>Portraits</option>
      <option>Mini Sessions</option>
      <option>Scenic</option>
    </select>

    <input 
      type="date" 
      name="entry.222132244" 
      required>

    <input 
      type="time" 
      name="entry.131441332" 
      required>

    <textarea 
      name="entry.221970120" 
      placeholder="Tell me what you're looking for"></textarea>

    <button type="submit">Submit Request</button>

  </form>

</section>

<iframe name="hidden_iframe" style="display:none;"></iframe>

<div id="footer"></div>

<script>
Promise.all([
  fetch("header.html").then(res => res.text()),
  fetch("footer.html").then(res => res.text())
]).then(([headerData, footerData]) => {

  document.getElementById("header").innerHTML = headerData;
  document.getElementById("footer").innerHTML = footerData;

  const yearEl = document.getElementById("year");
  if(yearEl){
    yearEl.textContent = new Date().getFullYear();
  }

  const menu = document.getElementById("menuToggle");
  const nav = document.getElementById("navLinks");
  const gallery = document.getElementById("galleryToggle");
  const dropdown = document.getElementById("dropdownMenu");

  let galleryOpened = false;

  if(menu){
    menu.onclick = () => nav.classList.toggle("active");
  }

  if(gallery){
    gallery.onclick = (e) => {
      if(window.innerWidth <= 1024){
        if(!galleryOpened){
          e.preventDefault();
          dropdown.classList.add("active");
          galleryOpened = true;
        } else {
          galleryOpened = false;
        }
      }
    };
  }

  document.addEventListener("click", function(e){
    if(nav && menu){
      if(!nav.contains(e.target) && !menu.contains(e.target)){
        nav.classList.remove("active");
        dropdown.classList.remove("active");
        galleryOpened = false;
      }
    }
  });

});
</script>

</body>
</html>
