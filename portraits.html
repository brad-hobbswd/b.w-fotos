<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nature Portraits | b.w fotos</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ===== GLOBAL ===== */
body{
  margin:0;
  font-family:'Inter', sans-serif;
  background:#1a1714;
  color:#e6dccf;
}

h1,h2{
  font-family:'Playfair Display', serif;
  letter-spacing:1px;
}

a{
  text-decoration:none;
  color:#d4a5ff;
}

/* ===== NAV ===== */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  border-bottom:1px solid rgba(212,165,255,0.2);
}

.logo{
  font-size:20px;
  letter-spacing:2px;
}

.nav-links a{
  margin-left:25px;
  font-size:14px;
  opacity:.8;
}

.nav-links a:hover{
  opacity:1;
}

/* ===== HERO ===== */
.hero{
  padding:100px 20px 60px;
  text-align:center;
}

.hero h1{
  font-size:42px;
  margin-bottom:10px;
}

.hero p{
  color:#d4a5ff;
  letter-spacing:2px;
  font-size:14px;
}

/* ===== SECTION TITLE ===== */
.section-title{
  text-align:center;
  margin:40px 0 10px;
  font-size:18px;
  color:#d4a5ff;
}

/* ===== GALLERY ===== */
.gallery{
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
  gap:15px;
}

.gallery img{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:8px;
  cursor:pointer;
  transition:.3s;
}

.gallery img:hover{
  transform:scale(1.03);
}

/* ===== LIGHTBOX ===== */
.lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
  border-radius:8px;
}

/* ===== CTA ===== */
.cta{
  text-align:center;
  padding:80px 20px;
}

.cta a{
  display:inline-block;
  padding:12px 25px;
  border:1px solid #d4a5ff;
  border-radius:25px;
}

.cta a:hover{
  background:#d4a5ff;
  color:#1a1714;
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:40px 20px;
  border-top:1px solid rgba(212,165,255,0.2);
  font-size:13px;
  opacity:.6;
}

</style>

</head>

<body>

<nav>
  <div class="logo">b.w fotos</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="gallery.html">Gallery</a>
    <a href="bookings.html">Contact</a>
  </div>
</nav>

<section class="hero">
  <h1>Nature Portraits</h1>
  <p>AUTHENTIC. NATURAL. REAL.</p>
</section>

<h2 class="section-title">Grandma Faye • Age 81</h2>
<section class="gallery">
  <img src="images/faye1.jpg" onclick="openLightbox(this.src)">
  <img src="images/faye2.jpg" onclick="openLightbox(this.src)">
  <img src="images/faye3.jpg" onclick="openLightbox(this.src)">
  <img src="images/faye4.jpg" onclick="openLightbox(this.src)">
</section>

<h2 class="section-title">Gabriel • Age 4.5</h2>
<section class="gallery">
  <img src="images/gabriel1.jpg" onclick="openLightbox(this.src)">
  <img src="images/gabriel2.jpg" onclick="openLightbox(this.src)">
  <img src="images/gabriel3.jpg" onclick="openLightbox(this.src)">
  <img src="images/gabriel4.jpg" onclick="openLightbox(this.src)">
</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img">
</div>

<section class="cta">
  <h2>Book a Nature Portrait Session</h2>
  <a href="bookings.html">Contact Me</a>
</section>

<footer>
  © 2026 b.w fotos | Capturing Moments. Preserving Stories.
</footer>

<script>
function openLightbox(src){
  document.getElementById("lightbox").style.display = "flex";
  document.getElementById("lightbox-img").src = src;
}

function closeLightbox(){
  document.getElementById("lightbox").style.display = "none";
}
</script>

</body>
</html>
