<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nature Portraits | b.w fotos</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ===== GLOBAL ===== */
body{
  margin:0;
  font-family:'Inter', sans-serif;
  background:#1a1714;
  color:#e6dccf;
}

h1,h2{
  font-family:'Playfair Display', serif;
}

/* ===== NAV ===== */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  border-bottom:1px solid rgba(212,165,255,0.2);
}

.nav-links a{
  margin-left:25px;
  font-size:14px;
  opacity:.8;
  text-decoration:none;
  color:#d4a5ff;
}

/* ===== HERO ===== */
.hero{
  text-align:center;
  padding:100px 20px 60px;
}

/* ===== ALBUM GRID (FIXED WIDTH) ===== */
.albums{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(240px, 320px));
  justify-content:center;
  gap:25px;
  padding:60px 20px;
}

.album{
  position:relative;
  cursor:pointer;
  overflow:hidden;
  border-radius:10px;
}

.album img{
  width:100%;
  height:300px;
  object-fit:cover;
  display:block;
  transition:.3s;
}

.album:hover img{
  transform:scale(1.03);
}

/* ===== OVERLAY ===== */
.album::after{
  content:"";
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:55%;
  background:linear-gradient(
    to top,
    rgba(0,0,0,0.8),
    rgba(0,0,0,0)
  );
}

/* ===== TEXT ===== */
.album-title{
  position:absolute;
  bottom:15px;
  left:15px;
  color:#ffffff;
  font-size:18px;
  z-index:2;
  text-shadow:0 2px 10px rgba(0,0,0,0.9);
}

/* ===== LIGHTBOX (FIXED OVERLAY) ===== */
.lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
}

.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:40px;
  color:white;
  cursor:pointer;
  padding:20px;
  z-index:10000;
}

.arrow.left{ left:20px; }
.arrow.right{ right:20px; }

/* ===== CTA ===== */
.cta{
  text-align:center;
  padding:80px 20px;
}

.cta a{
  padding:12px 25px;
  border:1px solid #d4a5ff;
  border-radius:25px;
  text-decoration:none;
  color:#d4a5ff;
}

.cta a:hover{
  background:#d4a5ff;
  color:#1a1714;
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:40px;
  opacity:.6;
}

</style>

</head>

<body>

<nav>
  <div>b.w fotos</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="gallery.html">Gallery</a>
    <a href="bookings.html">Contact</a>
  </div>
</nav>

<section class="hero">
  <h1>Nature Portraits</h1>
</section>

<!-- ===== ALBUMS ===== -->
<section class="albums">

  <div class="album" onclick="openAlbum('faye', 0)">
    <img src="images/IMG_1806.jpeg" alt="Grandma Faye">
    <div class="album-title">Grandma Faye • Age 81</div>
  </div>

  <div class="album" onclick="openAlbum('gabriel', 0)">
    <img src="images/IMG_1800.jpeg" alt="Gabriel">
    <div class="album-title">Gabriel • Age 4.5</div>
  </div>

</section>

<!-- ===== LIGHTBOX ===== -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="arrow left" onclick="prev(event)">❮</span>
  <img id="lightbox-img">
  <span class="arrow right" onclick="next(event)">❯</span>
</div>

<section class="cta">
  <h2>Book a Nature Portrait Session</h2>
  <a href="bookings.html">Contact Me</a>
</section>

<footer>
  © 2026 b.w fotos
</footer>

<script>

const albums = {
  faye: [
    "images/IMG_1806.jpeg",
    "images/IMG_1807.jpeg",
    "images/IMG_1808.jpeg",
    "images/IMG_1809.jpeg"
  ],
  gabriel: [
    "images/IMG_1800.jpeg",
    "images/IMG_1801.jpeg",
    "images/IMG_1802.jpeg",
    "images/IMG_1803.jpeg"
  ]
};

let currentAlbum = [];
let index = 0;

function openAlbum(name, i){
  currentAlbum = albums[name];
  index = i;
  document.getElementById("lightbox").style.display = "flex";
  document.getElementById("lightbox-img").src = currentAlbum[index];
}

function closeLightbox(){
  document.getElementById("lightbox").style.display = "none";
}

function next(e){
  e.stopPropagation();
  index = (index + 1) % currentAlbum.length;
  document.getElementById("lightbox-img").src = currentAlbum[index];
}

function prev(e){
  e.stopPropagation();
  index = (index - 1 + currentAlbum.length) % currentAlbum.length;
  document.getElementById("lightbox-img").src = currentAlbum[index];
}

</script>

</body>
</html>
