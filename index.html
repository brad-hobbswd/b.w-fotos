<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>b.w fotos | Capturing Moments. Preserving Stories.</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ===== GLOBAL ===== */
body{
  margin:0;
  padding-top:100px;
  font-family:'Inter', sans-serif;
  background:#1a1714;
  color:#e6dccf;
}

h1,h2,h3{
  font-family:'Playfair Display', serif;
  letter-spacing:1px;
  margin-bottom:10px;
}

a{
  text-decoration:none;
  color:#d4a5ff;
}

/* ===== HERO ===== */
.hero{
  width:100%;
  overflow:hidden;
}

.hero-banner{
  width:100%;
  display:block;
}

/* ===== ABOUT ===== */
.about{
  padding:50px 20px;
  max-width:900px;
  margin:auto;
  text-align:center;
}

.about p{
  line-height:1.8;
  opacity:.85;
}

/* ===== SERVICES ===== */
.services{
  padding:50px 20px;
  text-align:center;
}

.services-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(220px, 280px));
  justify-content:center;
  gap:20px;
}

.card{
  background:#211d19;
  border:1px solid rgba(212,165,255,0.15);
  padding:20px;
  border-radius:12px;
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#d4a5ff;
  box-shadow:0 0 20px rgba(212,165,255,0.15);
}

/* ===== CTA ===== */
.cta{
  text-align:center;
  padding:50px 20px;
}

/* ===== FOOTER ===== */
.site-footer{
  margin-top:80px;
  padding:40px 20px;
  text-align:center;
}

</style>

</head>

<body>

<!-- HEADER -->
<div id="header"></div>

<section class="hero">
  <img src="banner.png" class="hero-banner">
</section>

<section class="about">
  <h2>About b.w fotos</h2>
  <p>Photography rooted in identity, story, and perspective.</p>
  <p>Natural light, environment, and real moments come together to create images that feel honest and timeless.</p>
</section>

<section class="services">
  <h2>What I Capture</h2>

  <div class="services-grid">

    <a href="portraits.html" class="card">
      <h3>Nature Portraits</h3>
    </a>

    <a href="mini-sessions.html" class="card">
      <h3>Mini Sessions</h3>
    </a>

    <a href="scenic.html" class="card">
      <h3>Scenic Creative</h3>
    </a>

  </div>
</section>

<section class="cta">
  <h2>Let’s Create Something Timeless</h2>
</section>

<!-- FOOTER -->
<div id="footer"></div>

<script>
Promise.all([
  fetch("header.html").then(res => res.text()),
  fetch("footer.html").then(res => res.text())
]).then(([headerData, footerData]) => {

  document.getElementById("header").innerHTML = headerData;
  document.getElementById("footer").innerHTML = footerData;

  /* YEAR */
  const year = document.getElementById("year");
  if(year) year.textContent = new Date().getFullYear();

  /* NAV FUNCTIONALITY */
  const menu = document.getElementById("menuToggle");
  const nav = document.getElementById("navLinks");
  const gallery = document.getElementById("galleryToggle");
  const dropdown = document.getElementById("dropdownMenu");

  let galleryOpened = false;

  if(menu){
    menu.onclick = () => nav.classList.toggle("active");
  }

  if(gallery){
    gallery.onclick = (e) => {

      if(window.innerWidth <= 1024){

        if(!galleryOpened){
          e.preventDefault();
          dropdown.classList.add("active");
          galleryOpened = true;
        } else {
          galleryOpened = false;
        }

      }

    };
  }

  document.addEventListener("click", function(e){
    if(nav && menu){
      if(!nav.contains(e.target) && !menu.contains(e.target)){
        nav.classList.remove("active");
        dropdown.classList.remove("active");
        galleryOpened = false;
      }
    }
  });

});
</script>

</body>
</html>
