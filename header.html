  <div class="menu-toggle" id="menuToggle">☰</div>

  <div class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>

    <div class="dropdown">
      <a href="#" id="galleryToggle">Gallery ▾</a>

      <div class="dropdown-content" id="dropdownMenu">
        <a href="portraits.html">Portraits</a>
        <a href="mini-sessions.html">Mini Sessions</a>
        <a href="scenic.html">Scenic</a>
      </div>
    </div>

    <a href="bookings.html">Contact</a>
  </div>

</nav>

<style>

/* ===== HEADER ===== */
.site-header{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  max-width:1100px;
  z-index:9999;
  background:#1a1714;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 24px;
  border-radius:12px;
  border:1px solid rgba(212,165,255,0.15);
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* ===== LOGO ===== */
.logo{
  font-size:20px;
  letter-spacing:2px;
  color:#e6dccf;
}

/* ===== NAV LINKS ===== */
.nav-links{
  display:flex;
  align-items:center;
}

.nav-links a{
  margin-left:25px;
  font-size:14px;
  opacity:.8;
  color:#e6dccf;
  transition:.2s;
  text-decoration:none;
}

.nav-links a:hover{
  opacity:1;
  color:#d4a5ff;
}

/* ===== DROPDOWN ===== */
.dropdown{
  position:relative;
}

/* keep alignment */
.dropdown > a{
  margin-left:25px;
}

/* dropdown menu */
.dropdown-content{
  display:none;
  position:absolute;
  top:100%;   /* no gap */
  left:0;

  background:#211d19;
  border:1px solid rgba(212,165,255,0.2);
  border-radius:8px;

  min-width:160px;

  padding:8px 0;
  z-index:99999;
}

/* 🔥 KEY FIX: keeps dropdown open */
.dropdown:hover > .dropdown-content,
.dropdown:focus-within > .dropdown-content,
.dropdown-content:hover{
  display:block;
}

.dropdown-content a{
  display:block;
  padding:10px 14px;
  margin:0;
}

/* ===== HAMBURGER ===== */
.menu-toggle{
  display:none;
  font-size:26px;
  cursor:pointer;
  color:#e6dccf;
}

/* ===== MOBILE ===== */
@media(max-width:1024px){

  .menu-toggle{
    display:block;
  }

  .nav-links{
    position:fixed;
    top:85px;
    right:4%;
    width:240px;
    background:#1a1714;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.6);
    transition:.3s ease;
    opacity:0;
    pointer-events:none;
    transform:translateY(-10px);
  }

  .nav-links.active{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
  }

  .nav-links a{
    margin:12px 0;
    font-size:16px;
  }

  /* mobile dropdown */
  .dropdown-content{
    display:none;
    position:static;
    border:none;
    background:none;
    margin-left:10px;
  }

  .dropdown-content.active{
    display:block;
  }

}

</style>

<script>
const menuToggle = document.getElementById("menuToggle");
const navLinks = document.getElementById("navLinks");
const galleryToggle = document.getElementById("galleryToggle");
const dropdownMenu = document.getElementById("dropdownMenu");

// Mobile menu
menuToggle.addEventListener("click", () => {
  navLinks.classList.toggle("active");
});

// Mobile dropdown
galleryToggle.addEventListener("click", (e) => {
  if (window.innerWidth <= 1024) {
    e.preventDefault();
    dropdownMenu.classList.toggle("active");
  }
});
</script>
