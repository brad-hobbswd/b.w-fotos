<nav class="site-header">

  <div class="logo">b.w fotos</div>

  <!-- HAMBURGER -->
  <div class="menu-toggle" id="menuToggle">☰</div>

  <div class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>

    <div class="dropdown">
      <a href="gallery.html" id="galleryToggle">Gallery ▾</a>

      <div class="dropdown-content" id="dropdownMenu">
        <a href="portraits.html">Portraits</a>
        <a href="mini-sessions.html">Mini Sessions</a>
        <a href="scenic.html">Scenic</a>
      </div>
    </div>

    <a href="bookings.html">Contact</a>
  </div>

</nav>

<style>

/* ===== HEADER ===== */
.site-header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:9999;
  background:#1a1714;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 20px;
  border-bottom:1px solid rgba(212,165,255,0.2);
  padding-top: calc(16px + env(safe-area-inset-top));
}

/* ===== LOGO ===== */
.logo{
  font-size:20px;
  letter-spacing:2px;
  color:#e6dccf;
}

/* ===== DEFAULT (DESKTOP) ===== */
.nav-links{
  display:flex;
  align-items:center;
}

.nav-links a{
  margin-left:25px;
  font-size:14px;
  opacity:.8;
  color:#e6dccf;
}

.menu-toggle{
  display:none;
  font-size:26px;
  color:#e6dccf;
  cursor:pointer;
}

/* ===== DROPDOWN ===== */
.dropdown{
  position:relative;
}

.dropdown-content{
  display:none;
  position:absolute;
  top:35px;
  left:0;
  background:#211d19;
  border:1px solid rgba(212,165,255,0.2);
  border-radius:8px;
  min-width:160px;
}

.dropdown:hover .dropdown-content{
  display:block;
}

.dropdown-content a{
  display:block;
  padding:10px;
  margin:0;
}

/* ===== MOBILE + TABLET ===== */
@media(max-width:1024px){

  .menu-toggle{
    display:block;
  }

  .nav-links{
    position:fixed;
    top:80px;
    right:-260px;
    width:240px;
    height:100%;
    background:#1a1714;
    flex-direction:column;
    padding:25px;
    border-left:1px solid rgba(212,165,255,0.2);
    transition:.3s ease;
  }

  .nav-links.active{
    right:0;
  }

  .nav-links a{
    margin:12px 0;
  }

  .dropdown-content{
    position:static;
    border:none;
    display:none;
  }

  .dropdown-content.active{
    display:block;
  }

}

</style>

<script>

/* ===== HEADER OFFSET ===== */
window.addEventListener("load", function(){
  const header = document.querySelector(".site-header");
  document.body.style.paddingTop = header.offsetHeight + "px";
});

/* ===== FORCE CLOSED ===== */
window.addEventListener("load", function(){
  document.getElementById("navLinks").classList.remove("active");
});

/* ===== TOGGLE MENU ===== */
document.getElementById("menuToggle").addEventListener("click", function(){
  document.getElementById("navLinks").classList.toggle("active");
});

/* ===== MOBILE DROPDOWN ===== */
document.getElementById("galleryToggle").addEventListener("click", function(e){
  if(window.innerWidth <= 1024){
    e.preventDefault();
    document.getElementById("dropdownMenu").classList.toggle("active");
  }
});

/* ===== CLOSE ON OUTSIDE CLICK ===== */
document.addEventListener("click", function(e){
  const nav = document.getElementById("navLinks");
  const toggle = document.getElementById("menuToggle");

  if(!nav.contains(e.target) && !toggle.contains(e.target)){
    nav.classList.remove("active");
  }
});

</script>
