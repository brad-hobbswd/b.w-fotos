<nav class="site-header">

  <div class="logo">b.w fotos</div>

  <!-- HAMBURGER -->
  <div class="menu-toggle" onclick="toggleMenu()">☰</div>

  <div class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>

    <!-- DROPDOWN -->
    <div class="dropdown">
      <a href="gallery.html" onclick="toggleDropdown(event)">Gallery ▾</a>

      <div class="dropdown-content" id="dropdownMenu">
        <a href="portraits.html">Portraits</a>
        <a href="mini-sessions.html">Mini Sessions</a>
        <a href="scenic.html">Scenic</a>
      </div>
    </div>

    <a href="bookings.html">Contact</a>
  </div>

</nav>

<style>

/* ===== HEADER (FIXED + SAFE AREA FIX) ===== */
.site-header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:9999;

  background:#1a1714;
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:16px 40px;
  padding-top:calc(16px + env(safe-area-inset-top));

  border-bottom:1px solid rgba(212,165,255,0.2);
}

/* ===== LOGO ===== */
.logo{
  font-size:20px;
  letter-spacing:2px;
  color:#e6dccf;
}

/* ===== NAV LINKS ===== */
.nav-links{
  display:flex;
  align-items:center;
}

.nav-links a{
  margin-left:25px;
  font-size:14px;
  opacity:.8;
  color:#e6dccf;
  transition:.2s;
}

.nav-links a:hover{
  opacity:1;
  color:#d4a5ff;
}

/* ===== DROPDOWN ===== */
.dropdown{
  position:relative;
}

.dropdown-content{
  display:none;
  position:absolute;
  top:35px;
  left:0;
  background:#211d19;
  border:1px solid rgba(212,165,255,0.2);
  border-radius:8px;
  min-width:160px;
}

.dropdown-content a{
  display:block;
  padding:10px;
  margin:0;
}

/* desktop hover */
@media(min-width:769px){
  .dropdown:hover .dropdown-content{
    display:block;
  }
}

/* ===== HAMBURGER ===== */
.menu-toggle{
  display:none;
  font-size:24px;
  cursor:pointer;
  color:#e6dccf;
}

/* ===== MOBILE ===== */
@media(max-width:768px){

  .menu-toggle{
    display:block;
  }

  .nav-links{
    position:absolute;
    top:80px;
    right:0;
    width:220px;
    background:#1a1714;
    flex-direction:column;
    align-items:flex-start;
    padding:20px;
    border-left:1px solid rgba(212,165,255,0.2);
    display:none;
  }

  .nav-links a{
    margin:10px 0;
  }

  .nav-links.active{
    display:flex;
  }

  .dropdown-content{
    position:static;
    border:none;
    background:none;
    display:none;
  }

  .dropdown-content.active{
    display:block;
  }

  .dropdown-content a{
    padding-left:10px;
    opacity:.7;
  }

}

</style>

<script>

/* ===== FIX PAGE OFFSET (CRITICAL FIX) ===== */
document.addEventListener("DOMContentLoaded", function(){
  document.body.style.paddingTop = "100px";
});

/* ===== ACTIVE LINK ===== */
const links = document.querySelectorAll('.nav-links a');
const current = window.location.pathname.split("/").pop();

links.forEach(link => {
  if(link.getAttribute("href") === current){
    link.style.opacity = "1";
    link.style.color = "#d4a5ff";
  }
});

/* ===== MOBILE MENU ===== */
function toggleMenu(){
  document.getElementById("navLinks").classList.toggle("active");
}

/* ===== MOBILE DROPDOWN ===== */
function toggleDropdown(e){
  if(window.innerWidth <= 768){
    e.preventDefault();
    document.getElementById("dropdownMenu").classList.toggle("active");
  }
}

/* ===== CLOSE MENU WHEN CLICK OUTSIDE ===== */
document.addEventListener("click", function(e){
  const nav = document.getElementById("navLinks");
  const toggle = document.querySelector(".menu-toggle");

  if(!nav.contains(e.target) && !toggle.contains(e.target)){
    nav.classList.remove("active");
  }
});

</script>
